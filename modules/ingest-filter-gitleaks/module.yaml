# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:ingest-filter-gitleaks
name: 'Ingest filter: secrets (gitleaks)'
version: 0.2.0
description: 'Blocks files containing secrets before anything is stored. PII filtering (Presidio) is a later
  module in the same slot. A plain command (paths in; clean paths and blocked findings out as JSON); fails
  closed.'
license: MIT
kind: processor
slots:
- ingest-filter
protected: true
agent:
  iri: urn:kk:agent:ingest-filter
  db_role: kkm_ingest_filter
  member_of:
  - kk_agent
runtime:
  type: command
  entrypoint: python -m ingest_filter --repo <dir> <paths...>
triggers:
- type: manual
mcp:
  expose: []
migration: migration.sql
