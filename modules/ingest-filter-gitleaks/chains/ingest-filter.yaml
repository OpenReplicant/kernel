# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:ingest-filter
name: Filter secrets
description: Runs gitleaks on the candidate files; passes the clean ones on and logs the blocked ones.
protected: true
runs_as: urn:kk:agent:ingest-filter
trigger:
  type: chain
steps:
- id: scan
  do: http
  with:
    method: POST
    url: http://ingest-filter:8000/filter
  next:
    success: decide
- id: decide
  do: switch
  with:
    lang: python
    source: return 'blocked' if msg['blocked'] else 'clean'
  next:
    blocked: log_blocked
- id: log_blocked
  do: log
