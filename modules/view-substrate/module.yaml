# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:view-substrate
name: Substrate read model
version: 0.1.0
description: 'Substrate''s read model over the claims encoder-substrate writes (D-103), as SQL in its own
  schema `substrate`: usable (per subject and property the preferred claims if any, else the normal ones,
  never deprecated), label, search over labels, aliases and page text, page (an item as Markdown in the layout
  of Substrate''s own pages), map, map_nodes and alternatives (a whole, its parts and roles, the interfaces
  they require and provide, what else could fill a role). Only views and functions, all security invoker, over
  api.claims and api.claim_references: a claim in a scope the reader is not cleared for is in no answer.
  Reads only; the writes and constraint checks stay in Substrate (D-104).'
license: Apache-2.0
kind: decoder
slots:
- read-model
protected: false
agent:
  iri: urn:kk:agent:view-substrate
  db_role: kkm_view_substrate
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:vocab
  - urn:kk:scope:default
runtime:
  type: sql
accepts:
- 'wdt:P527 (has part) with the qualifier wdt:P3831 (object of statement has role)'
- 'substrate:requiresInterface'
- 'substrate:providesInterface'
- 'rdfs:label (items in Substrate''s namespaces)'
- 'dcterms:description'
- 'skos:altLabel'
produces:
- 'application/sql (views and functions in schema substrate: usable, entity, entity_text, wholes, label, search, page, map, map_nodes, alternatives)'
migration: migration.sql
