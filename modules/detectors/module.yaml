# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:detectors
name: Detectors
version: 0.1.0
description: 'Reacts to what changed (M6-T0, D-110). Reads the kernel''s applied order (api.applied) from a
  cursor and, per pass, runs each registered detector on its owner''s connection, so clearance applies: a
  detector never sees a claim its owner cannot read. A detector is a SQL query over api.edges and api.claims
  that returns match keys, the nodes each names and the claims it was made from; it is given the entities
  the applied change sets changed, and looks only there. The module compares what matches now with the
  matches it stored and records formed and dissolved events, as claims (prov:Activity, as:instrument the
  detector, prov:used the match), by submit_change_set. Level-triggered: a match that forms and dissolves
  between two passes is never seen. A detector that fails stops only itself; the failure is a failed run.
  One pass at a time. The cursor is the latest successful run''s info. map-gaps runs on it.'
license: Apache-2.0
kind: processor
slots:
- detector
protected: false
agent:
  iri: urn:kk:agent:detectors
  db_role: kkm_detectors
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:default
  write:
  - urn:kk:scope:default
runtime:
  type: python-service
  entrypoint: python -m detectors
  env:
    DATABASE_URL: login that may SET ROLE kkm_detectors and each detector's owner (kk_authenticator)
    KK_DETECTORS_FILE: YAML file of the registered detectors
    KK_DETECTORS_FULL_EVERY: every nth pass looks at everything, not only what changed (default 20)
    KK_DETECTORS_BATCH: change sets read per pass (default 1000)
    KK_SWEEP_SECONDS: longest wait between passes (default 30)
accepts:
- 'claim (whatever a registered detector''s query reads in api.claims and api.edges)'
produces:
- 'prov:Activity (an event: dcterms:type urn:kk:event-kind:formed or :dissolved, as:instrument the detector, prov:used the match, dcterms:relation each node, as:published the time)'
- 'prov:Entity (a match: dcterms:type the detector, rdfs:label its key)'
triggers:
- type: notify
  spec: kernel_change_set
- type: schedule
  spec: every KK_SWEEP_SECONDS
mcp:
  expose: []
migration: migration.sql
