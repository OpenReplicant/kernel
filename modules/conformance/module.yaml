# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:conformance
name: Conformance processor
version: 0.2.0
description: 'Compares each documented process (BPMN encoder, process-extraction skill) with what was
  observed (event-log encoder) and claims every discrepancy — skipped step, swapped order, rework,
  unexpected path, path never taken, time limit exceeded — as an oa:Annotation targeting the steps,
  inferred and derived from the claims compared. Each discrepancy waits in the review lane (D-50).'
license: Apache-2.0
kind: processor
slots:
- reasoner
protected: false
agent:
  iri: urn:kk:agent:conformance
  db_role: kkm_conformance
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:vocab
  - urn:kk:scope:default
  write:
  - urn:kk:scope:default
runtime:
  type: python-service
  entrypoint: python -m conformance
  env:
    DATABASE_URL: the module's own login, or one that may SET ROLE kkm_conformance
    KK_SWEEP_SECONDS: sweep interval (default 30)
    KK_MIN_SHARE: "paths taken in a smaller share of cases are reported together as one rare discrepancy (default 0.01)"
accepts:
- 'bbo:has_nextFlowNode (documented and observed)'
- 'sosa:Observation (directly-follows counts, waits, case counts)'
- 'bbo:maxValue (documented limits)'
produces:
- add_claim
- set_status
- 'oa:Annotation (a discrepancy: dcterms:type urn:kk:discrepancy-kind:*, oa:hasTarget the steps, oa:bodyValue)'
triggers:
- type: pattern
  spec: '? bbo:has_nextFlowNode ?'
- type: pattern
  spec: '? sosa:hasSimpleResult ?'
- type: pattern
  spec: '? bbo:maxValue ?'
- type: schedule
  spec: every KK_SWEEP_SECONDS (sweep; NOTIFY is not durable)
mcp:
  expose: []
migration: migration.sql
