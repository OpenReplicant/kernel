# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:encoder-compose
name: Compose encoder
version: 0.1.0
description: 'Records compose files (the Compose Specification: compose.yaml) as claims in kk-tosca''s terms (D-125): the
  project a service template whose version is the file (kkt:hasArtifact, D-101), each service a node template with
  its node type (the image''s repository), its image, profiles, ports and volumes as property values, its
  environment variables by name only (never their values), and its dependencies. Services are urn:kk:node:<name>,
  where other modules'' claims about the same part meet (the self-encoder, encoder-backstage). Every claim is
  deterministic and cites the file and line it came from. Reading a changed file supersedes what the earlier
  version said; an unchanged one submits nothing. decoder-compose renders the file back from the artifact and the
  current claims.'
license: Apache-2.0
kind: encoder
slots:
- encoder
protected: false
agent:
  iri: urn:kk:agent:encoder-compose
  db_role: kkm_encoder_compose
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:vocab
  - urn:kk:scope:default
  write:
  - urn:kk:scope:default
runtime:
  type: command
  entrypoint: python -m encoder_compose --project <name> compose.yaml
  env:
    DATABASE_URL: the module's own login, or one that may SET ROLE kkm_encoder_compose
    KK_ARTIFACTS: the artifact store (default ~/.local/share/knowledge-kernel/artifacts)
requires:
- slot: artifact-store
accepts:
- application/yaml (compose files, the Compose Specification)
produces:
- add_artifact
- add_claim
- set_status
- 'kkt:ServiceTemplate (rdf:type)'
- 'kkt:NodeTemplate (rdf:type)'
- 'kkt:hasArtifact'
- 'kkt:memberOf'
- 'kkt:nodeType'
- 'kkt:dependsOn'
- 'kkt:propertyValue (kkt:propertyName as qualifier: image, profile, port, volume, environment)'
- 'rdfs:label'
triggers:
- type: manual
mcp:
  expose: []
migration: migration.sql
