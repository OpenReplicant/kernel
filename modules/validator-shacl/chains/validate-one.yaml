# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:validate-one
name: Validate one change set
description: Runs the validator service on one change set and records the result.
protected: true
runs_as: urn:kk:agent:validator
trigger:
  type: chain
steps:
- id: validate
  do: http
  with:
    method: POST
    url: http://validator:8000/validate
    body: ${msg}
  next:
    success: record
    failure: log_error
- id: record
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/record_validation
    body:
      change_set_id: ${msg.id}
      ok: ${msg.ok}
      report: ${msg.report}
- id: log_error
  do: log
