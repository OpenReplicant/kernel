# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:validate-change-sets
name: Validate submitted change sets
description: Polls submitted change sets, validates each with pySHACL and the JSON Schema, records the
  verdict.
protected: true
runs_as: urn:kk:agent:validator
trigger:
  type: schedule
  spec: every 2s
steps:
- id: fetch
  do: http
  with:
    method: GET
    url: ${KK_API}/change_sets?status=eq.submitted&order=submitted_at&limit=20
  next:
    success: each
- id: each
  do: subchain
  with:
    chain: urn:kk:chain:validate-one
    for_each: ${msg}
