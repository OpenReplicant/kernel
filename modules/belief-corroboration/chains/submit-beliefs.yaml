# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:submit-beliefs
name: Submit belief scores
description: Submits one change set of belief scores, generated by this step's own run.
protected: true
runs_as: urn:kk:agent:belief-corroboration
trigger:
  type: chain
steps:
- id: submit
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/submit_change_set
    body:
      cs:
        idempotency_key: ${msg.idempotency_key}
        attributed_to: ${msg.attributed_to}
        generated_by: ${run.id}
        target_scope: ${msg.target_scope}
        ops: ${msg.ops}
