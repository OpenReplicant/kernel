# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:rescore-belief
name: Re-score affected claims
description: Asks the belief model for claims whose belief changed since the last pass and submits the
  new values, one change set per scope. Polls (milestone 1 has no NOTIFY bridge).
protected: true
runs_as: urn:kk:agent:belief-corroboration
trigger:
  type: schedule
  spec: every 5s
steps:
- id: score
  do: http
  with:
    method: POST
    url: http://belief:8000/rescore
    body: {}
  next:
    success: submit_each
- id: submit_each
  do: subchain
  with:
    chain: urn:kk:chain:submit-beliefs
    for_each: ${msg.change_sets}
