# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:kernel-mcp
name: Kernel MCP server
version: 0.8.0
description: 'Agent-facing MCP tools over the api schema, in two profiles chosen per login (M6-T1): memory
  (remember, recall, explain, changes_since: one-sentence memories and cited briefings with who said what and
  its belief, also as MCP resources) and operator (every tool): search, get entity, query claims, explain, submit
  change set, start/finish run, list slots and modules; whoami, change sets, the review queue and review
  (people only, enforced by the kernel), and the graph projection that the UI draws. Talks to Postgres directly and runs every call as
  the caller''s own role (stdio: the agent''s own login; http: the role in the caller''s JWT), so row-level security
  and attribution apply per agent. Ships harness hooks (kernel-mcp-hook: session run, recall on every
  prompt) and the knowledge-kernel skill.'
license: Apache-2.0
kind: interface
slots:
- agent-interface
protected: true
agent:
  iri: urn:kk:agent:kernel-mcp
  member_of:
  - kk_agent
runtime:
  type: python-service
  entrypoint: python -m kernel_mcp
  env:
    DATABASE_URL: 'stdio: the agent''s own login; http: kk_authenticator'
    KK_JWT_SECRET: http mode (python -m kernel_mcp --http) only
    KK_PROFILE: 'stdio: memory (four tools) or operator (every tool, the default); http: the token''s profile claim'
    KK_MEMORY_SCOPE: the scope remember writes to (default urn:kk:scope:default)
requires:
- slot: identity
interfaces:
- name: mcp
  affordance: action
  transport: mcp
  href: /mcp
mcp:
  expose:
  - remember
  - recall
  - changes_since
  - search
  - get_entity
  - query_claims
  - explain
  - submit_change_set
  - start_run
  - get_change_set
  - finish_run
  - list_slots
  - list_modules
  - list_runs
  read_only: false
skill: SKILL.md
accepts:
- claim
- change_set
- run
produces:
- 'add_claim (and every op, as the calling agent)'
- as:Note
- as:content
- dcterms:type
- dcterms:subject
- application/json (MCP tool results)
