# Installable for harnesses: pip install ./modules/kernel-mcp, or
#   uvx --from "git+https://github.com/OpenReplicant/kernel#subdirectory=modules/kernel-mcp" kernel-mcp
# The container image installs the exact pins in requirements.txt instead.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-kernel-mcp"
version = "0.5.0"
description = "MCP server and harness hooks for the Knowledge Kernel"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "psycopg[binary]==3.3.6", "PyJWT==2.15.1", "uvicorn==0.54.0"]

[project.scripts]
kernel-mcp = "kernel_mcp.__main__:main"
kernel-mcp-hook = "kernel_mcp.hooks:main"

[tool.setuptools]
packages = ["kernel_mcp"]
