# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:skill-interview
name: 'Skill: interview a person to map the organisation and its processes'
version: 0.1.0
description: 'Instructions for a harness agent to interview a person and record what they say about their
  organisation (W3C ORG: units, posts, who holds them, who reports to whom) and its processes (BBO: steps,
  order, who does each), every claim extracted with the exact words of the message it came from, which
  the interaction encoder recorded (so the quote verifier, not the agent, checks it). The agent asks next
  about the gaps the map gap processor lists. The same steps run as a worker for the chat pane of the Map view
  (D-117): the answer a person gives is recorded as a message, its claims come from the scripted answers file or a
  small model, and the next question is the first gap listed.'
license: Apache-2.0
kind: agent
slots:
- agent-skill
protected: false
agent:
  iri: urn:kk:agent:interviewer
  db_role: kkm_interviewer
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:default
  write:
  - urn:kk:scope:default
runtime:
  type: python-service
  entrypoint: python -m interviewer
  env:
    DATABASE_URL: login that may SET ROLE kkm_interviewer, kkm_encoder_interaction and kkm_map_gaps (kk_authenticator)
    KK_ARTIFACTS: the artifact store the encoder writes the transcripts to
    KK_CHATS: the chat files (default beside the artifacts)
    KK_EXTRACT_URL: an OpenAI-compatible endpoint for free answers (a :free small model or a local one); none, and only scripted answers are read
    KK_EXTRACT_MODEL: the model (default liquid/lfm-2.5-2.6b:free)
requires:
- slot: agent-interface
accepts:
- 'as:Note (the person''s messages, recorded by the interaction encoder)'
- 'oa:Annotation (the gaps: dcterms:type urn:kk:gap-kind:*)'
produces:
- add_claim
- org:Post
- org:OrganizationalUnit
- org:FormalOrganization
- prov:Person
- 'org:holds (extracted, with the quote)'
- org:reportsTo
- org:postIn
- org:unitOf
- 'bbo:has_nextFlowNode (extracted, with the quote)'
- 'bbo:has_resource (the post that does a step)'
triggers:
- type: manual
mcp:
  expose: []
migration: migration.sql
skill: SKILL.md
