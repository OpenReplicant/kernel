# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:scan-self
name: Scan the repository
description: Filter secrets, store artifacts, emit claims per file kind, submit one change set per file.
protected: false
runs_as: urn:kk:agent:self-encoder
trigger:
  type: http
  spec: /scan
steps:
- id: list_files
  do: script
  with:
    lang: python
    path: scripts/list_files.py
  next:
    success: filter
- id: filter
  do: subchain
  with:
    chain: urn:kk:chain:ingest-filter
  next:
    success: encode
    failure: log_blocked
- id: encode
  do: script
  with:
    lang: python
    path: scripts/encode.py
  next:
    success: submit
- id: submit
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/submit_change_set
- id: log_blocked
  do: log
