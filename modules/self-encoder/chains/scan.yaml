# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:scan-self
name: Scan the repository
description: List the self-model files, filter secrets, store artifacts and encode claims, submit one
  change set per file.
protected: false
runs_as: urn:kk:agent:self-encoder
trigger:
  type: http
  spec: /scan
steps:
- id: list_files
  do: http
  with:
    method: POST
    url: http://self-encoder:8000/list
    body: {}
  next:
    success: filter
- id: filter
  do: subchain
  with:
    chain: urn:kk:chain:ingest-filter
  next:
    success: encode
- id: encode
  do: http
  with:
    method: POST
    url: http://self-encoder:8000/encode
  next:
    success: submit_each
- id: submit_each
  do: subchain
  with:
    chain: urn:kk:chain:submit-change-set
    for_each: ${msg.change_sets}
