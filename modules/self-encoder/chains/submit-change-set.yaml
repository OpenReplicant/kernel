# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:submit-change-set
name: Submit one change set
description: Submits one encoded change set, generated by this step's own run.
protected: false
runs_as: urn:kk:agent:self-encoder
trigger:
  type: chain
steps:
- id: submit
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/submit_change_set
    body:
      cs:
        idempotency_key: ${msg.idempotency_key}
        attributed_to: ${msg.attributed_to}
        generated_by: ${run.id}
        target_scope: ${msg.target_scope}
        ops: ${msg.ops}
