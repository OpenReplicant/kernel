# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:example
name: Example chain
description: Reacts to applied change sets.
protected: false
runs_as: urn:kk:agent:example
trigger:
  type: notify
  spec: kernel_change_set
steps:
- id: fetch
  do: http
  with:
    method: GET
    url: ${KK_API}/claims?change_set=eq.${msg.id}
  next:
    success: work
- id: work
  do: script
  with:
    lang: python
    path: scripts/work.py
  next:
    success: submit
    failure: log_error
- id: submit
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/submit_change_set
    body: ${msg.change_set}
- id: log_error
  do: log
