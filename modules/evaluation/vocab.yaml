# Evaluation vocabulary (L2): what a system was evaluated with and what came out, and the
# models it calls. Results are `observed` in a session context (with spans in the run's
# recordings) or `stated` in a source's perspective (a paper's reported numbers).
vocabulary: evaluation
version: "0.2"
imports: [systems]
prefix: { ev: "urn:pc:evaluation:" }

types:
  - { iri: ev:Model,     is_a: k:Thing }
  - { iri: ev:Endpoint,  is_a: k:Thing }     # where a model is served, and how to call it
  - { iri: ev:Harness,   is_a: k:Agent }     # an agent harness (Codex, Claude Code, ...); M5
  - { iri: ev:Benchmark, is_a: k:Thing }

apis: [anthropic, openai]                    # openai: any OpenAI-compatible chat endpoint
price_kinds: [input, output, cache_read, cache_write]

predicates:
  # Models and how to reach them (catalog: modules/evaluation/models.yaml)
  - { iri: ev:model_id,      domain: ev:Model,    range: literal,     max: 1 }   # the id the endpoint takes
  - { iri: ev:served_by,     domain: ev:Model,    range: ev:Endpoint, max: 1 }
  - { iri: ev:price,         domain: ev:Model,    range: literal,     args: [per] }   # USD per million tokens; per: one of price_kinds
  - { iri: ev:default_param, domain: ev:Model,    range: literal,     args: [name] }  # e.g. max_tokens
  - { iri: ev:api,           domain: ev:Endpoint, range: literal,     max: 1, enum_from: apis }
  - { iri: ev:base_url,      domain: ev:Endpoint, range: literal,     max: 1 }
  - { iri: ev:key_env,       domain: ev:Endpoint, range: literal,     max: 1 }   # name of the env var holding the key, never the key
  # What a system or run used and got
  - { iri: ev:uses_model,      domain: k:Context,   range: ev:Model, args: [model_role] }
  - { iri: ev:model_param,     domain: k:Context,   range: literal,  args: [model_role, name] }
  - { iri: ev:evaluated_on,    domain: k:Context,   range: ev:Benchmark }
  - { iri: ev:setting,         domain: k:Context,   range: literal,  args: [name] }   # harness, split, subset, metrics, baselines
  - { iri: ev:acceptance,      domain: k:Context,   range: literal,  max: 1 }         # {mode, value, note}
  - { iri: ev:version_hash,    domain: ev:Benchmark, range: literal, max: 1 }
  - { iri: ev:metric,          domain: k:Context,   range: literal,  args: [name] }   # observed result of a run
  - { iri: ev:reported_result, domain: k:Thing,     range: literal,  args: [metric, condition] }
