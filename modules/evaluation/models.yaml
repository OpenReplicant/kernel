# Model catalog: the models and endpoints this installation knows about. load_catalog()
# records each entry in the kernel as `stated` facts with a span to its lines here, so `why`
# on a price or a model id points back to this file. Changing an entry supersedes the old
# fact on the next load; nothing is edited in place.
#
# Prices: USD per million tokens, Anthropic first-party API rates (Claude API reference,
# model table cached 2026-10-06). Haiku 5.5's rates are for prompts up to 100K tokens.
# A missing cache_read price is charged at the input price and a missing cache_write price
# at 1.25x input, so an unknown price never under-counts the budget.
#
# Other endpoints (a local OpenAI-compatible server, another provider) are added the same
# way: an endpoint with `api: openai`, its base_url, and the env var holding its key.

endpoints:
  - id: anthropic
    api: anthropic
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY

  # The logged-in Claude Code session (`claude -p`): uses its subscription, no API key. Calls
  # are unpriced (cost 0); their tokens are still counted and recorded.
  - id: claude-code
    api: claude_code

models:
  - id: claude-haiku-5-5
    endpoint: anthropic
    prices: { input: 0.10, output: 0.50 }
    params: { max_tokens: 16000 }

  - id: claude-sonnet-5-5
    endpoint: anthropic
    prices: { input: 2.00, output: 10.00, cache_read: 0.20 }
    params: { max_tokens: 16000 }

  - id: claude-opus-5-5
    endpoint: anthropic
    prices: { input: 4.00, output: 20.00, cache_read: 0.20 }
    params: { max_tokens: 16000 }

  - id: claude-code-haiku
    endpoint: claude-code
    model_id: haiku
