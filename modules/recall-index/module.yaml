# Module manifest — schema: kernel/schemas/module.schema.json
id: urn:kk:module:recall-index
name: 'Recall index: BM25'
version: 0.1.0
description: 'Keeps a BM25 index over the claims it can read, in its own schema `recall` (derived and
  rebuildable, never a kernel table), with the kernel''s row-level security by scope: a reader finds only
  claims and term statistics of scopes they may read. Follows applied change sets and redactions. When it
  is installed, the MCP search tool and the recall hook rank with BM25 instead of plain full-text search
  (D-60).'
license: Apache-2.0
kind: processor
slots:
- recall-index
protected: false
agent:
  iri: urn:kk:agent:recall-index
  db_role: kkm_recall_index
  member_of:
  - kk_agent
clearance:
  read:
  - urn:kk:scope:vocab
  - urn:kk:scope:default
  write: []
runtime:
  type: python-service
  entrypoint: python -m recall_index
  env:
    DATABASE_URL: the module's own login, or one that may SET ROLE kkm_recall_index
    KK_SWEEP_SECONDS: longest wait between passes (default 30)
accepts:
- claim
- redaction
produces:
- 'application/json (api.recall: ranked claim ids)'
triggers:
- type: notify
  spec: kernel_change_set
- type: notify
  spec: kernel_redaction
- type: schedule
  spec: every KK_SWEEP_SECONDS
mcp:
  expose: []
migration: migration.sql
