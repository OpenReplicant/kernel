# Chain definition — schema: kernel/schemas/chain.schema.json
chain: urn:kk:chain:submit-decoder-claims
name: Submit chain decoder claims
description: Submits one change set from the chain decoder, generated by this step's own run.
protected: true
runs_as: urn:kk:agent:chain-decoder-rulego
trigger:
  type: chain
steps:
- id: submit
  do: http
  with:
    method: POST
    url: ${KK_API}/rpc/submit_change_set
    body:
      cs:
        idempotency_key: ${msg.idempotency_key}
        attributed_to: ${msg.attributed_to}
        generated_by: ${run.id}
        target_scope: ${msg.target_scope}
        ops: ${msg.ops}
