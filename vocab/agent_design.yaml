# Agent-design vocabulary: primitives (roles), scopes and the facts a compiled spec asserts.
# See docs/CONCEPTS.md for meanings. Loaded after kernel.yaml.
vocabulary: agent-design
version: "0.1"
imports: [kernel]
prefix: { ad: "urn:pc:agent-design:" }

types:
  - { iri: ad:Paper,     is_a: k:Thing }
  - { iri: ad:Component, is_a: k:Thing }        # a registry implementation
  - { iri: ad:Prompt,    is_a: k:Thing }
  - { iri: ad:MechanismTest, is_a: k:Thing }
  - { iri: ad:Claim,     is_a: k:Thing }

scopes: [call, step, episode, task, lifetime]

# Slot types. cardinality: exclusive (one owner per system), pipeline (ordered stack),
# multi (several named instances). Ports listed are the minimum; papers may add more.
roles:
  - { iri: ad:ContextBuilder,       group: decision,    cardinality: pipeline,  ports: [run:in, input:in, output:out] }
  - { iri: ad:Policy,               group: decision,    cardinality: exclusive, ports: [start:in, output:out] }
  - { iri: ad:Planner,              group: decision,    cardinality: exclusive, ports: [run:in, plan:out] }
  - { iri: ad:WorldModel,           group: decision,    cardinality: multi,     ports: [run:in, prediction:out] }
  - { iri: ad:ActionSpace,          group: environment, cardinality: multi,     ports: [call:in, result:out] }
  - { iri: ad:ObservationProcessor, group: environment, cardinality: pipeline,  ports: [input:in, output:out] }
  - { iri: ad:Evaluator,            group: judgment,    cardinality: multi,     ports: [run:in, pass:out, fail:out, score:out] }
  - { iri: ad:Reflector,            group: judgment,    cardinality: multi,     ports: [run:in, insight:out] }
  - { iri: ad:Refiner,              group: judgment,    cardinality: multi,     ports: [run:in, output:out] }
  - { iri: ad:Memory,               group: state,       cardinality: multi,     ports: [write:in, written:out, read:out] }
  - { iri: ad:ContextManager,       group: state,       cardinality: exclusive, ports: [input:in, output:out] }
  - { iri: ad:Controller,           group: control,     cardinality: multi,     ports: [decide:in, retry:out, stop:out] }
  - { iri: ad:Search,               group: control,     cardinality: exclusive, ports: [run:in, best:out] }
  - { iri: ad:Aggregator,           group: control,     cardinality: multi,     ports: [run:in, output:out] }
  - { iri: ad:Topology,             group: control,     cardinality: exclusive, ports: [run:in, output:out] }
  - { iri: ad:Curriculum,           group: control,     cardinality: exclusive, ports: [run:in, task:out] }

# Facts about a slot instance (a role node created per system context)
predicates:
  - { iri: ad:slot_type,      domain: k:Role, range: k:Role, max: 1 }          # instance -> one of the roles above
  - { iri: ad:scope,          domain: k:Role, range: literal, max: 1, enum_from: scopes }
  - { iri: ad:subtype,        domain: k:Role, range: literal, max: 1 }
  - { iri: ad:mode,           domain: k:Role, range: literal, max: 1, enum: [replace, wrap, add] }
  - { iri: ad:order,          domain: k:Role, range: literal, max: 1 }
  - { iri: ad:param,          domain: k:Role, range: literal, args: [name] }  # one assertion per parameter
  - { iri: ad:uses_prompt,    domain: k:Role, range: ad:Prompt }
  - { iri: ad:model_role,     domain: k:Role, range: literal, max: 1 }
  - { iri: ad:implementation_kind, domain: ad:Component, range: literal, max: 1, enum: [exec_node, sub_chain, mcp_tool, rulego_node, aspect] }
  - { iri: ad:entrypoint,     domain: ad:Component, range: literal, max: 1 }
  - { iri: ad:implements,     domain: ad:Component, range: k:Role }          # component can fill this slot type
  # Papers and their claims
  - { iri: ad:describes_system, domain: ad:Paper, range: k:Context }         # paper -> its compiled system context
  - { iri: ad:claims,         domain: ad:Paper,   range: ad:Claim }
  - { iri: ad:text,           domain: k:Thing,    range: literal, max: 1 }
  # Mechanism tests (body is the structured given/within/expect/negate object)
  - { iri: ad:tests_claim,    domain: ad:MechanismTest, range: ad:Claim }
  - { iri: ad:test_body,      domain: ad:MechanismTest, range: literal, max: 1 }
  # Paper metadata and spec sections not covered above (needed for a lossless agent-spec view)
  - { iri: ad:title,          domain: ad:Paper, range: literal, max: 1 }
  - { iri: ad:author,         domain: ad:Paper, range: literal, args: [position] }
  - { iri: ad:year,           domain: ad:Paper, range: literal, max: 1 }
  - { iri: ad:venue,          domain: ad:Paper, range: literal, max: 1 }
  - { iri: ad:arxiv,          domain: ad:Paper, range: literal, max: 1 }
  - { iri: ad:source_ref,     domain: ad:Paper, range: literal, args: [kind, commit, license] }  # until the file is a kb.source
  - { iri: ad:summary,        domain: ad:Paper, range: literal, max: 1 }
  - { iri: ad:implemented_by, domain: k:Role,   range: ad:Component, max: 1, args: [source] }   # source: registry|paper_code|generated
  - { iri: ad:prompt_file,    domain: ad:Prompt, range: literal, max: 1 }
  - { iri: ad:eval_setting,   domain: k:Context, range: literal, args: [name] }   # benchmark, split, subset, metrics, baselines
  - { iri: ad:acceptance,     domain: k:Context, range: literal, max: 1, args: [mode, note] }
  - { iri: ad:fidelity_overall, domain: k:Context, range: literal, max: 1, enum: [full, partial, approximate] }
  - { iri: ad:fidelity_gap,   domain: k:Context, range: literal, args: [where, expected_impact] }
  - { iri: ad:compat,         domain: k:Context, range: literal, args: [relation] }  # wraps|conflicts|requires|notes
  # Any assertion may carry these arguments: source_ref (free-text pointer, kept even after
  # spans exist), sweep (values for ablation grids), condition (on couplings).
  # Outcomes (method: observed, in a run context)
  - { iri: ad:mechanism_test_passed, domain: ad:MechanismTest, range: literal, max: 1 }
  - { iri: ad:metric,         domain: k:Context,  range: literal, args: [name, task_set] }

constraints:
  - { kind: required, predicate: ad:slot_type, for: k:Role, in: system }
  - { kind: required, predicate: ad:scope,     for: k:Role, in: system }
  - { kind: cardinality_by_role, roles_with: exclusive, max_instances: 1, in: system }
  - { kind: python, name: mcp_only_for_model_invoked }       # registered by apps/paper_compiler
  - { kind: python, name: couplings_reference_declared_ports }
