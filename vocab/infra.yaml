# Infrastructure vocabulary: assets a system needs, models, environments, benchmarks.
vocabulary: infra
version: "0.1"
imports: [kernel]
prefix: { in: "urn:pc:infra:" }

types:
  - { iri: in:Asset,       is_a: k:Thing }
  - { iri: in:Model,       is_a: k:Thing }
  - { iri: in:Benchmark,   is_a: k:Thing }
  - { iri: in:Environment, is_a: in:Asset }

asset_kinds: [vector_store, kv_store, relational, graph, blob, code_store,
              environment, mcp_server, model_endpoint, eval_harness, external_service]

predicates:
  - { iri: in:asset_kind,   domain: in:Asset, range: literal, max: 1, enum_from: asset_kinds }
  - { iri: in:requirement,  domain: in:Asset, range: literal, args: [name] }
  - { iri: in:uses_asset,   domain: k:Role,   range: in:Asset }
  - { iri: in:driver,       domain: in:Environment, range: literal, max: 1, enum: [podman, docker, kubernetes, external] }
  - { iri: in:lifecycle,    domain: in:Environment, range: literal, max: 1, enum: [per_run, per_task, per_episode, per_branch] }
  - { iri: in:network,      domain: in:Environment, range: literal, max: 1, enum: [none, allowlist, open] }
  - { iri: in:resource,     domain: in:Environment, range: literal, args: [name] }
  - { iri: in:config,       domain: in:Asset, range: literal, args: [key] }   # nested settings: environment, mcp, external
  # Models: the paper's original and the one this system uses, per model role
  - { iri: in:paper_model,  domain: k:Context, range: literal, args: [model_role] }
  - { iri: in:uses_model,   domain: k:Context, range: in:Model, args: [model_role] }
  - { iri: in:model_param,  domain: k:Context, range: literal, args: [model_role, name] }
  # Benchmarks and conditions of a run (also recorded on the run context's props)
  - { iri: in:evaluated_on, domain: k:Context, range: in:Benchmark }
  - { iri: in:version_hash, domain: in:Benchmark, range: literal, max: 1 }
  - { iri: in:reported_result, domain: k:Thing, range: literal, args: [metric, condition] }
