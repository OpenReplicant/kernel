[project]
name = "world-model-kernel"
version = "0.1.0"
description = "A lightweight world model any agent can plug into: an append-only claim log, its graph projection and an MCP gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
]
papers = [
    "arxiv>=4.0,<5",
    "habanero>=2.9,<3",
    "pyalex>=0.21,<1",
]

[project.scripts]
wmk-gateway = "gateway.server:main"
wmk-papers = "wmk_papers.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "kernel", "evals", "packs/research/mcp/wmk_papers"]

[tool.hatch.build.targets.wheel.force-include]
"kernel/sql" = "kernel/sql"

[tool.uv]
# The papers group is the research pack's paper-source server; images opt in to it.
default-groups = ["dev", "papers"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "kernel", "evals", "tests", "wmk_papers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
