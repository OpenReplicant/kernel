# The kernel and its default modules as one install, with the `kk` command:
#   pip install -e .          (from a checkout: kk init reads kernel/schema, modules/*, shapes/ from it)
# For MCP alone in a harness, modules/kernel-mcp installs just kernel-mcp and its hooks.
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-kernel"
version = "0.1.0"
description = "A small knowledge kernel for agent harnesses: one Postgres, MCP, and swappable default modules"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0", "psycopg[binary]==3.3.6", "PyJWT==2.15.1", "uvicorn==0.54.0",
  "pyshacl==0.40.1", "rdflib==7.6.0", "PyYAML==6.0.3", "jsonschema==4.26.0",
]

[project.optional-dependencies]
# Dense recall (D-61): the recall-dense worker and query embeddings. fastembed is Apache-2.0; it runs
# ONNX models on CPU (onnxruntime, MIT) and downloads the model on first use.
dense = ["fastembed==0.7.3"]

[project.scripts]
kk = "kk.cli:main"
kernel-mcp = "kernel_mcp.__main__:main"
kernel-mcp-hook = "kernel_mcp.hooks:main"
kernel-mcp-cue = "kernel_mcp.pretool:main"

[tool.setuptools]
packages = ["kk", "kernel_mcp", "validator", "belief_corroboration", "self_encoder", "ingest_filter",
            "eventlog_encoder", "bpmn_encoder", "conformance", "observer_prometheus", "anomaly",
            "actuator_compose", "paper_encoder", "recall_index", "recall_dense",
            "verifier_quotes", "evaluator", "process_learner", "interaction_encoder",
            "map_gaps", "truth_maintenance"]

[tool.setuptools.package-dir]
kernel_mcp = "modules/kernel-mcp/kernel_mcp"
validator = "modules/validator-shacl/validator"
belief_corroboration = "modules/belief-corroboration/belief_corroboration"
self_encoder = "modules/self-encoder/self_encoder"
ingest_filter = "modules/ingest-filter-gitleaks/ingest_filter"
eventlog_encoder = "modules/encoder-eventlog/eventlog_encoder"
bpmn_encoder = "modules/encoder-bpmn/bpmn_encoder"
conformance = "modules/conformance/conformance"
observer_prometheus = "modules/observer-prometheus/observer_prometheus"
anomaly = "modules/anomaly/anomaly"
actuator_compose = "modules/actuator-compose/actuator_compose"
paper_encoder = "modules/encoder-papers/paper_encoder"
recall_index = "modules/recall-index/recall_index"
recall_dense = "modules/recall-dense/recall_dense"
verifier_quotes = "modules/verifier-quotes/verifier_quotes"
evaluator = "modules/evaluator/evaluator"
process_learner = "modules/learner-process/process_learner"
interaction_encoder = "modules/encoder-interaction/interaction_encoder"
map_gaps = "modules/map-gaps/map_gaps"
truth_maintenance = "modules/truth-maintenance/truth_maintenance"
