# The tool calls an extractor following the core skill makes for this fixture.
# {{chunk:<source>:<seq>}} is a chunk id, {{ref:<name>}} an id returned for "$<name>" earlier.
# Every write reads the schema slice for its claim first and uses that head_offset.

- ingest: process
- ingest: interview
- ingest: email

# Process document: the process and its owner
- write:
    claim: {text: "The invoice approval process is owned by the Finance department.", source: "{{chunk:process:0}}", quote: "Acme Tools pays supplier invoices through one invoice approval process, owned by the Finance department",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $process, kind: process, namespace: bpm, name: Invoice approval}
      - {op: create, ref: $finance, kind: org_unit, namespace: bpm, name: Finance}
      - {op: assert, edge: responsible_for, from: $finance, to: $process}

# Steps
- write:
    claim: {text: "Accounts payable receives supplier invoices by email.", source: "{{chunk:process:1}}", quote: "Accounts payable receives supplier invoices by email",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $receive, kind: activity, namespace: bpm, name: Receive invoice}
      - {op: create, ref: $ap, kind: org_unit, namespace: bpm, name: Accounts payable}
      - {op: create, ref: $invoice, kind: data, name: Supplier invoice, aliases: [invoice]}
      - {op: assert, edge: part_of, from: $receive, to: "{{ref:process}}"}
      - {op: assert, edge: responsible_for, from: $ap, to: $receive}
      - {op: assert, edge: reads_from, from: $receive, to: $invoice}

- write:
    claim: {text: "An AP clerk enters each invoice into the ERP system.", source: "{{chunk:process:1}}", quote: "An AP clerk enters each invoice into the ERP system",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $enter, kind: activity, namespace: bpm, name: Enter invoice}
      - {op: create, ref: $clerk, kind: role, namespace: bpm, name: AP clerk}
      - {op: create, ref: $erp, kind: component, name: ERP system}
      - {op: assert, edge: part_of, from: $enter, to: "{{ref:process}}"}
      - {op: assert, edge: responsible_for, from: $clerk, to: $enter}
      - {op: assert, edge: uses, from: $enter, to: $erp}
      - {op: assert, edge: reads_from, from: $enter, to: "{{ref:invoice}}"}
      - {op: assert, edge: flows_to, from: "{{ref:receive}}", to: $enter}

- write:
    claim: {text: "The clerk checks the invoice against its purchase order.", source: "{{chunk:process:1}}", quote: "The clerk checks the invoice against its purchase order",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $check, kind: activity, namespace: bpm, name: Check invoice against purchase order}
      - {op: create, ref: $po, kind: data, name: Purchase order}
      - {op: assert, edge: part_of, from: $check, to: "{{ref:process}}"}
      - {op: assert, edge: responsible_for, from: "{{ref:clerk}}", to: $check}
      - {op: assert, edge: reads_from, from: $check, to: $po}
      - {op: assert, edge: flows_to, from: "{{ref:enter}}", to: $check}

# A first attempt sends the flow to the role instead of a step: rejected, then fixed.
- write:
    claim: {text: "If the amounts match, the invoice goes to the invoice approver.", source: "{{chunk:process:1}}", quote: "If the amounts match, the invoice goes to the invoice approver",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $match, kind: gateway, namespace: bpm, name: "Amounts match?"}
      - {op: create, ref: $approver, kind: role, namespace: bpm, name: Invoice approver}
      - {op: assert, edge: flows_to, from: $match, to: $approver}
  expect: {rejected: "urn:wmk:rule:domain-range"}

- write:
    claim: {text: "If the amounts match, the invoice goes to the invoice approver, who approves it.",
            source: "{{chunk:process:1}}", quote: "If the amounts match, the invoice goes to the invoice approver", basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $match, kind: gateway, namespace: bpm, name: "Amounts match?"}
      - {op: create, ref: $approver, kind: role, namespace: bpm, name: Invoice approver}
      - {op: create, ref: $approve, kind: activity, namespace: bpm, name: Approve invoice}
      - {op: assert, edge: part_of, from: $match, to: "{{ref:process}}"}
      - {op: assert, edge: part_of, from: $approve, to: "{{ref:process}}"}
      - {op: assert, edge: flows_to, from: "{{ref:check}}", to: $match}
      - {op: assert, edge: flows_to, from: $match, to: $approve}
      - {op: assert, edge: responsible_for, from: $approver, to: $approve}

- write:
    claim: {text: "Finance pays approved invoices in the Friday payment run.", source: "{{chunk:process:1}}", quote: "Finance pays approved invoices in the Friday payment run",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $pay, kind: activity, namespace: bpm, name: Pay invoice}
      - {op: assert, edge: part_of, from: $pay, to: "{{ref:process}}"}
      - {op: assert, edge: flows_to, from: "{{ref:approve}}", to: $pay}
      - {op: assert, edge: responsible_for, from: "{{ref:finance}}", to: $pay}

- write:
    claim: {text: "Only approved invoices may be paid.", source: "{{chunk:process:1}}", quote: "Only approved invoices may be paid",
            basis: reported, modality: normative}
    ops:
      - {op: promote, ref: $policy, about: ["{{ref:pay}}"]}

# Roles
- write:
    claim: {text: "Dana Ruiz has been the invoice approver since 1 January 2025.", source: "{{chunk:process:2}}", quote: "Dana Ruiz (dana@acme.test) has been the invoice approver since 1 January 2025",
            basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $dana, type: Agent, kind: human, name: Dana Ruiz, identity: {email: dana@acme.test}}
      - {op: assert, ref: $dana_approver, edge: implements, from: $dana, to: "{{ref:approver}}",
         valid_from: "2025-01-01"}

- write:
    claim: {text: "Lee Park is the AP clerk.", source: "{{chunk:process:2}}", quote: "Lee Park (lee@acme.test) is the AP clerk", basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $lee, type: Agent, kind: human, name: Lee Park, identity: {email: lee@acme.test}}
      - {op: assert, edge: implements, from: $lee, to: "{{ref:clerk}}"}

# Interview: Sam took over. A careless create of Dana is caught by resolution.
- write:
    claim: {text: "Sam Ortiz took over invoice approval from Dana at the start of March 2026.",
            source: "{{chunk:interview:0}}", quote: "I took over invoice approval from Dana at the start of March 2026, when she moved to the treasury team", basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $sam, type: Agent, kind: human, name: Sam Ortiz}
      - {op: create, ref: $dana2, type: Agent, kind: human, name: Dana Ruiz}
  expect: {rejected: "urn:wmk:write:duplicate"}

- write:
    claim: {text: "Sam Ortiz took over invoice approval from Dana at the start of March 2026.",
            source: "{{chunk:interview:0}}", quote: "I took over invoice approval from Dana at the start of March 2026, when she moved to the treasury team", basis: reported, modality: descriptive}
    ops:
      - {op: create, ref: $sam, type: Agent, kind: human, name: Sam Ortiz}
      - {op: assert, ref: $sam_approver, edge: implements, from: $sam, to: "{{ref:approver}}",
         valid_from: "2026-03-01"}
      - {op: assert, edge_id: "{{ref:dana_approver}}", valid_to: "2026-03-01"}

- write:
    claim: {text: "Invoices under 500 euros are often paid without any approval.", source: "{{chunk:interview:0}}", quote: "Invoices under 500 euros are often paid without any approval",
            basis: reported, modality: descriptive}
    ops:
      - {op: promote, ref: $practice, about: ["{{ref:pay}}", "{{ref:approve}}"]}
      - {op: assert, edge: contradicts, from: $practice, to: "{{ref:policy}}"}

- write:
    claim: {text: "The invoice process feels slow and nobody likes the ERP screens.", source: "{{chunk:interview:0}}", quote: "Sam: Honestly, it feels slow, and nobody likes the ERP screens",
            basis: reported, modality: descriptive}
    ops: []
    unresolved: {reason: "a perceived quality of the process; no kind or edge for sentiment"}

# Email: Dana still signs off. A third source, siding with the process document.
- write:
    claim: {text: "Dana Ruiz still signs off all supplier invoices before the Friday payment run.",
            source: "{{chunk:email:0}}", quote: "Reminder: Dana Ruiz still signs off all supplier invoices before the Friday payment run", basis: reported, modality: descriptive}
    ops:
      - {op: assert, edge_id: "{{ref:dana_approver}}", valid_to: null}

# Read back and answer with citations.
- query:
    cypher: "MATCH (a:Agent)-[e:implements]->(r:Entity {name: 'Invoice approver'}) WHERE e.belief_status = 'contested' RETURN a.name AS who"
    expect_rows: 2

- cite:
    sentences:
      - {text: "Sam Ortiz says he has approved supplier invoices since March 2026.", edges: ["{{ref:sam_approver}}"]}
      - {text: "The process document and a payments email still name Dana Ruiz.", edges: ["{{ref:dana_approver}}"]}
      - {text: "Who approves invoices is therefore contested."}
