  - {type: Claim, kind: descriptive, name: "On the NewsSum-2 benchmark, RGD raises factual consistency from 71% to 84%.",
     belief_status: accepted}
  - {type: Claim, kind: descriptive, name: "On NewsSum-2, ROUGE-L drops by 0.4 points with RGD.", belief_status: accepted}
  - {type: Claim, kind: descriptive, name: "RGD did not improve factual consistency on GovLong (78% with gating, 77% without).",
     belief_status: accepted}
  - {type: Claim, kind: descriptive,
     name: "Sentence-level gating scored the same as token-level gating on GovLong, which suggests the gain reported on news does not come from gating at the token level.",
     belief_status: accepted}
  - {type: Claim, kind: descriptive,
     name: "On the MedNotes corpus, RGD raised factual consistency from 64% to 79%, in line with earlier results on news summaries.",
     belief_status: accepted}
  # Hypotheses: one a paper states, one an open question, one the extractor's synthesis
  - {type: Claim, kind: hypothetical,
     name: "Gating at the token level, rather than the sentence level, drives RGD's gain in factual consistency.",
     belief_status: accepted}
  - {type: Claim, kind: hypothetical,
     name: "Whether RGD improves factual consistency on documents longer than 4,000 tokens remains an open question.",
     belief_status: accepted}
  - {type: Claim, kind: hypothetical, name: Retrieval-gated decoding improves the factual consistency of abstractive summaries.,
     belief_status: accepted}

