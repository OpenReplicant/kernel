name: retrieval-gating
description: >
  Three synthetic papers (fictional authors, methods, benchmarks and DOIs under the
  10.5555 test prefix) on one summarization method: a paper introducing it, a paper
  that fails to replicate it on long documents and challenges its explanation, and a
  paper that replicates it and leaves an open question. Exercises the research pack:
  per-paper findings as Claim nodes, reports and authorship, a duplicate method and an
  identity-key duplicate caught by resolution, a domain-range rejection fixed on retry,
  supports and contradicts across papers, a synthesis hypothesis with evidence for and
  against, an unresolved claim, evidence queries and citations.
namespaces: [research]
