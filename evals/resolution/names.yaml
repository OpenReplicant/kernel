  - {name: Jane, type: Agent, identity: {email: Jane.Smith@Northwind.TEST}, expect: jane}
  - {name: J. Smith, type: Agent, expect: unclear, among: [jane, john]}
  - {name: Jon Smith, type: Agent, expect: john}
  - {name: José Álvarez, type: Agent, expect: jose}
  - {name: Jose Alvarez, type: Agent, expect: jose}
  - {name: Bob Brown, type: Agent, expect: robert}
  - {name: Rob Brown, type: Agent, expect: robert}
  - {name: Robert Green, type: Agent, expect: new}
  - {name: Jane Smithson, type: Agent, expect: new}
