# Resolution eval set: a known world, and mentions to resolve against it with lookup_entities.
#
# expect: the key of the node the mention denotes; `new` when it denotes something not in
# the known world; `unclear` (with `among`) when the mention alone cannot say which node
# it means, so the model must decide.
#
# Scoring (evals/resolution.py): the kernel acts on the certain and high bands by itself
# (a create with such a candidate is rejected), so an auto-band candidate that is wrong is
# the costly error. Floors guard against regressions; raise them as resolution improves.
name: names
# Organisational units and roles come from the reference pack.
packs: [bpm-reference]
floors:
  auto_precision: 1.0     # every certain/high top candidate is the right node
  new_clean: 1.0          # no new or unclear mention gets a certain/high candidate
  candidate_recall: 0.85  # the right node is among the candidates (any band)
  auto_recall: 0.5        # the right node is the top candidate in an auto band

known:
  - {key: jane, type: Agent, kind: human, name: Jane Smith, identity: {email: jane.smith@northwind.test}}
  - {key: john, type: Agent, kind: human, name: John Smith}
  - {key: jose, type: Agent, kind: human, name: José Álvarez}
  - {key: robert, type: Agent, kind: human, name: Robert Brown, aliases: [Bob Brown]}
  - {key: northwind, kind: org_unit, namespace: bpm, name: Northwind Foods, aliases: [Northwind]}
  - {key: northwind_log, kind: org_unit, namespace: bpm, name: Northwind Logistics}
  - {key: acme, kind: org_unit, namespace: bpm, name: Acme Inc.}
  - {key: sap, kind: component, name: SAP S/4HANA, aliases: [SAP]}
  - {key: coupa, kind: component, name: Coupa}
  - {key: approver, kind: role, namespace: bpm, name: Invoice approver}
  - {key: approval, kind: activity, namespace: bpm, name: Invoice approval}
  - {key: receive, kind: activity, namespace: bpm, name: Receive invoice}
  - {key: ap, kind: org_unit, namespace: bpm, name: Accounts payable}
  - {key: ar, kind: org_unit, namespace: bpm, name: Accounts receivable}
  - {key: p2p, kind: process, namespace: bpm, name: Procure to pay, aliases: [P2P]}

mentions:
