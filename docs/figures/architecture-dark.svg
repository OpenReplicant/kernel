<text x="190.0" y="44" font-size="19" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#e6edf3">ENCODERS</text>
<text x="190.0" y="66" font-size="13.5" text-anchor="middle" fill="#9198a1">turn what is sensed into sourced claims</text>
<rect x="40" y="88" width="300" height="680" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="540.0" y="44" font-size="19" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#e6edf3">KERNEL</text>
<text x="540.0" y="66" font-size="13.5" text-anchor="middle" fill="#9198a1">one write path, one log, computed belief</text>
<rect x="390" y="88" width="300" height="680" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<text x="890.0" y="44" font-size="19" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#e6edf3">DECODERS</text>
<text x="890.0" y="66" font-size="13.5" text-anchor="middle" fill="#9198a1">read at one offset, write nothing but cites</text>
<rect x="740" y="88" width="300" height="680" rx="18" fill="#161b22" stroke="#3d444d" stroke-width="1.5"/>
<rect x="56" y="108" width="268" height="68" rx="10" fill="#ffffff" stroke="#8a8f98" stroke-width="1.6"/>
<text x="190.0" y="139.0" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Claim + graph operations</text>
<text x="190.0" y="159.5" font-size="13" text-anchor="middle" fill="#1f2328">text · source · quote · basis · ops</text>
<rect x="56" y="200" width="268" height="76" rx="10" fill="#f3efb5" stroke="#a89a2c" stroke-width="1.6"/>
<text x="190.0" y="226.75" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Extraction run</text>
<text x="190.0" y="247.25" font-size="13" text-anchor="middle" fill="#1f2328">closing it retracts what older</text>
<text x="190.0" y="263.75" font-size="13" text-anchor="middle" fill="#1f2328">runs found and it did not</text>
<rect x="56" y="300" width="129.0" height="132" rx="10" fill="#cfe6f5" stroke="#4f86b0" stroke-width="1.6"/>
<text x="120.5" y="338.25" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Deterministic</text>
<text x="120.5" y="358.75" font-size="13" text-anchor="middle" fill="#1f2328">reader: exports,</text>
<text x="120.5" y="375.25" font-size="13" text-anchor="middle" fill="#1f2328">event logs, repos,</text>
<text x="120.5" y="391.75" font-size="13" text-anchor="middle" fill="#1f2328">stacks, forges</text>
<text x="120.5" y="408.25" font-size="13" text-anchor="middle" fill="#1f2328">→ observed claims</text>
<rect x="195.0" y="300" width="129.0" height="132" rx="10" fill="#fbd9ae" stroke="#c98330" stroke-width="1.6"/>
<text x="259.5" y="338.25" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Model + skills</text>
<text x="259.5" y="358.75" font-size="13" text-anchor="middle" fill="#1f2328">a person reviews</text>
<text x="259.5" y="375.25" font-size="13" text-anchor="middle" fill="#1f2328">each claim</text>
<text x="259.5" y="391.75" font-size="13" text-anchor="middle" fill="#1f2328">→ reported claims</text>
<text x="259.5" y="408.25" font-size="13" text-anchor="middle" fill="#1f2328">that quote</text>
<rect x="56" y="456" width="268" height="76" rx="10" fill="#f6d0d4" stroke="#bf6672" stroke-width="1.6"/>
<text x="190.0" y="482.75" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Store each source</text>
<text x="190.0" y="503.25" font-size="13" text-anchor="middle" fill="#1f2328">chunks with spans, content hash;</text>
<text x="190.0" y="519.75" font-size="13" text-anchor="middle" fill="#1f2328">sealed under its people's keys</text>
<rect x="56" y="556" width="268" height="76" rx="10" fill="#cdeac5" stroke="#559b4c" stroke-width="1.6"/>
<text x="190.0" y="582.75" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Consent</text>
<text x="190.0" y="603.25" font-size="13" text-anchor="middle" fill="#1f2328">each person recorded is created</text>
<text x="190.0" y="619.75" font-size="13" text-anchor="middle" fill="#1f2328">by the claim of their consent</text>
<rect x="56" y="656" width="268" height="76" rx="10" fill="#cfe6f5" stroke="#4f86b0" stroke-width="1.6"/>
<text x="190.0" y="682.75" font-size="15.5" font-weight="700" text-anchor="middle" fill="#1f2328">Convert at the edge</text>
<text x="190.0" y="703.25" font-size="13" text-anchor="middle" fill="#1f2328">PDF, Word → text: markitdown,</text>
<text x="190.0" y="719.75" font-size="13" text-anchor="middle" fill="#1f2328">docling, GROBID</text>
