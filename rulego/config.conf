# RuleGo-Server configuration (tools/dev.sh substitutes __DATA__).
data_dir = __DATA__
server = :9090
default_username = admin
debug = false
run_log_mode = off
require_auth = false
share_http_server = true
# The exec node is not used; its default whitelist (docker, git, pip, gcc, ...) is replaced
# by a name no command has, so any exec node is refused.
cmd_mode = allow
cmd_white_list = kernel-exec-disabled

[mcp]
enable = false
