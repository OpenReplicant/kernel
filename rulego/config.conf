# RuleGo-Server configuration for this repo (see docs/RULEGO_NOTES.md).
data_dir = /var/lib/rulego/data
server = :9090
default_username = admin
# Debug data per node: handy while spiking, off for benchmark runs.
debug = false
run_log_mode = off
# exec nodes may run only the Python interpreter; step scripts are under /repo (read-only).
cmd_white_list = python3
# JS/expr script timeout (ms). Does not apply to exec nodes.
script_max_execution_time = 5000
require_auth = false
share_http_server = true

[mcp]
enable = false
