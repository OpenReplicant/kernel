id: urn:kk:eval:belief-v0/conflict-on-single-value-property
description: Two independent sources disagree on a module's version.
input:
  functional:
  - kk:version
  claims:
  - id: a
    key: v1
    subject: urn:x:m
    predicate: kk:version
    object: v1
    agent: enc
    sources:
    - file:a
  - id: b
    key: v2
    subject: urn:x:m
    predicate: kk:version
    object: v2
    agent: other
    sources:
    - file:b
expect:
  beliefs:
    a: 0.3333
    b: 0.3333
