id: urn:kk:eval:belief-v0/same-agent-does-not-inflate
description: One agent asserts the same statement from two files.
input:
  functional:
  - owl:versionInfo
  claims:
  - id: a
    key: v1
    subject: urn:x:m
    predicate: owl:versionInfo
    object: v1
    agent: enc
    sources:
    - file:a
  - id: b
    key: v1
    subject: urn:x:m
    predicate: owl:versionInfo
    object: v1
    agent: enc
    sources:
    - file:b
expect:
  beliefs:
    a: 0.5
    b: 0.5
