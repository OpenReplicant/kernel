# Papers: Papers read into cited claims, recalled by search, with their quotes checked against the source and answers scored as claims.
# Generated by `kk distribution bundle papers`; edit .env, not this file. Images are pulled, never built here.
#   cp .env.example .env     # fill it in (README.md says how)
#   podman compose up -d     # docker compose works too
name: kk-papers

x-kk: &kk
  image: ${KK_IMAGE:-ghcr.io/openreplicant/kernel:0.1.0}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:

  # The kernel's store: Postgres with pgvector, pg_cron, pgmq and pgGraph.
  db:
    image: ${KK_DB_IMAGE:-ghcr.io/openreplicant/kernel-postgres:0.1.0}
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron,graph", "-c", "cron.database_name=kk"]
    environment:
      POSTGRES_DB: kk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KK_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kk"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: installs the kernel, the default modules and the packs (does nothing once installed). Also the
  # place to run admin commands: `podman compose run --rm init kk ...` (README.md).
  init:
    <<: *kk
    command: ["kk", "init"]
    environment:
      KK_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/kk
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
      KK_DISTRIBUTION: papers
      KK_ARTIFACTS: /artifacts
      KK_CHATS: /chats
      HOME: /tmp
      KK_HOME: /tmp/kk-home
    volumes:
      - kk-artifacts:/artifacts
      - kk-chats:/chats
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  # MCP over HTTP, the UI, the validator, the belief model and the rest of papers's parts.
  kernel:
    <<: *kk
    command: ["kk", "serve", "--host", "0.0.0.0", "--only", "${KK_SERVE_PARTS:-mcp,validator,belief,recall,quotes}"]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD}@db:5432/kk
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
      KK_ARTIFACTS: /store
      KK_DISTRIBUTION: papers
      KK_CHATS: /chats
    volumes:
      - kk-artifacts:/store:ro
      - kk-chats:/chats
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - "127.0.0.1:${KK_HTTP_PORT:-8083}:80"
    depends_on: [kernel]
    restart: unless-stopped

volumes:
  db-data:
  kk-artifacts:
  kk-chats:
