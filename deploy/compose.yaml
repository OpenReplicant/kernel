# Knowledge Kernel — Postgres plus one kk image (D-36, D-42)
#
#   cp deploy/.env.example deploy/.env                       # fill in secrets
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm init kk person add owner --steward
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm init kk agent add claude-code
#   docker compose -f deploy/compose.yaml --env-file deploy/.env run --rm -v "$PWD":/repo:ro \
#     -v kk-artifacts:/artifacts kernel kk scan --repo /repo       # ingest a repository
#
# `person add` and `agent add` print the new login's password once. The kernel needs none of this to
# be useful: an agent harness can run kernel-mcp over stdio against any Postgres with the kernel
# installed (docs/harness.md). Works the same with Podman. Ports are published on localhost only:
# Postgres (for stdio agents and kk review, each with its own login) and Caddy, which is replaceable
# by any reverse proxy (it only routes /mcp). To split the kernel into one container per part, run
# the same image three times with `kk serve --only mcp`, `--only validator` and `--only belief`.
#
# Further modules run in their own locked-down containers on the internal network `kernel-db`, which
# reaches Postgres and nothing else (D-43):
#   KK_ADMIN_URL=postgresql://postgres:<password>@localhost:5432/kk kk module install modules/<name>
#   docker compose -f deploy/compose.yaml -f deploy/modules/<name>.yaml --env-file deploy/.env up -d
# KK_SERVE_PARTS chooses what the kernel container runs (default mcp,validator,belief,recall): leave out a
# part that runs as its own module container.

name: knowledge-kernel

x-kk: &kk
  build: {context: .., dockerfile: Dockerfile}
  image: knowledge-kernel:local
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:

  # The kernel's store: plain Postgres. Extensions are installed by module migrations.
  db:
    build: ./postgres
    environment:
      POSTGRES_DB: kk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KK_DB_PORT:-5432}:5432"
    networks: [default, kernel-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kk"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: installs the kernel, the default modules and the packs (does nothing once installed),
  # and sets the services' login password. Also the place to run admin commands (see above).
  init:
    <<: *kk
    command: ["kk", "init"]
    environment:
      KK_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/kk
      KK_AUTHENTICATOR_PASSWORD: ${KK_AUTHENTICATOR_PASSWORD:?set in .env}
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  # MCP over HTTP (each request carries the agent's own token) + the validator + the belief model.
  # One login that switches to each part's own role; never a superuser, never given to agents (D-37).
  kernel:
    <<: *kk
    command: ["kk", "serve", "--host", "0.0.0.0", "--only", "${KK_SERVE_PARTS:-mcp,validator,belief,recall}"]
    environment:
      DATABASE_URL: postgresql://kk_authenticator:${KK_AUTHENTICATOR_PASSWORD}@db:5432/kk
      KK_JWT_SECRET: ${KK_JWT_SECRET:?set in .env}
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  caddy:
    image: ${CADDY_IMAGE:?pin in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [kernel]
    restart: unless-stopped

volumes:
  db-data:

networks:
  # Internal: module containers reach Postgres here and nothing else (no route out).
  kernel-db:
    internal: true
