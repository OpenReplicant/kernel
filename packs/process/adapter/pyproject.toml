[project]
name = "wmk-process"
version = "0.1.0"
description = "The process pack's event-log adapter: maps CSV, XES and OCEL 2.0 event logs into the World Model Kernel as the view of a process as done, and checks the mapped process against them."
requires-python = ">=3.12"
dependencies = [
    "wmk-adapter-kit",
    "anyio>=4.5,<5",
    "mcp>=2.3,<3",
    "pyyaml>=6.0,<7",
]

[project.scripts]
wmk-process = "wmk_process.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmk_process"]
