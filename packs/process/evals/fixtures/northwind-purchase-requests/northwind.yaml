# wmk-process configuration for Northwind's purchase-request log (see generate.py).
process: Purchase requests
log:
  file: log/purchase-requests.csv
  columns: {case: case_id, activity: activity, timestamp: timestamp, role: role}
  attributes: [amount, category, urgent]
case_object: Purchase request
system: Coupa
origin: system:northwind-coupa
labels:
  PR_SUBMIT: Submit purchase request
  PR_REVIEW: Review purchase request
  PR_REVISE: Revise purchase request
  PR_REJECT: Reject purchase request
  PR_APPROVE: Approve purchase request
  PO_CREATE: Create purchase order
  PO_SEND: Send purchase order
# The views wmk-process compare reads: the SOP and the interviews of northwind-views. The
# view as done is the log's.
views:
  as written: ["sop:fin-007"]
  as told: ["interview:nw-2026-09-15-a", "interview:nw-2026-09-16-b"]
