     to: Approve purchase request}
  - {edge: about,
     from: "When an urgent request over 10,000 euros comes in, procurement creates and sends the order first and the finance controller approves it afterwards.",
     to: Send purchase order}
  - {edge: contradicts,
     from: "When an urgent request over 10,000 euros comes in, procurement creates and sends the order first and the finance controller approves it afterwards.",
     to: "No purchase order may be created for a request over 10,000 euros without the finance controller's approval."}

