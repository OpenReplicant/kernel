  - {edge: flows_to, from: Check budget, to: Review purchase request, belief_status: contested}
  - {edge: flows_to, from: Submit purchase request, to: Review purchase request, belief_status: accepted}
  - {edge: flows_to, from: Review purchase request, to: Revise purchase request, belief_status: accepted}
  - {edge: flows_to, from: Revise purchase request, to: Review purchase request}
  - {edge: flows_to, from: Review purchase request, to: Reject purchase request}
  - {edge: flows_to, from: Review purchase request, to: "Over 10,000 euros?"}
  # The routing rule: the SOP and Lucia (from August) for, Maya against
  - {edge: flows_to, from: "Over 10,000 euros?", to: Approve purchase request, valid_from: null,
     belief_status: contested}
  - {edge: flows_to, from: "Over 10,000 euros?", to: Create purchase order, belief_status: accepted}
  - {edge: flows_to, from: Approve purchase request, to: Create purchase order, belief_status: accepted}
  - {edge: flows_to, from: Create purchase order, to: Send purchase order}
  - {edge: flows_to, from: Send purchase order, to: Approve purchase request, belief_status: accepted}
  # People and their roles
  - {edge: implements, from: Maya Chen, to: procurement, belief_status: accepted}
