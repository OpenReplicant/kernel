[project]
name = "world-model-kernel"
version = "0.2.0"
description = "A lightweight world model any agent can plug into: an append-only claim log, its graph projection and an MCP gateway."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3,<4",
    "psycopg-pool>=3.3,<4",
    "httpx>=0.28,<1",
    "pyyaml>=6.0,<7",
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "packaging>=24,<27",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.16,<1",
    # Pack packages, so `make test` runs every pack's tests.
    "wmk-papers",
]

[project.scripts]
wmk-gateway = "gateway.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "kernel", "evals"]

[tool.hatch.build.targets.wheel.force-include]
"kernel/sql" = "kernel/sql"

[tool.uv.workspace]
# Packs that ship Python (servers, adapters) are workspace members with their own pyproject.
members = ["packs/*/mcp"]

[tool.uv.sources]
wmk-papers = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gateway", "kernel", "evals", "tests", "wmk_papers"]

[tool.pytest.ini_options]
testpaths = ["tests", "packs"]
addopts = "-ra"
