[project]
name = "wmk-papers"
version = "0.1.0"
description = "The research pack's paper-source MCP server: arXiv, OpenAlex and Crossref for the World Model Kernel."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "arxiv>=4.0,<5",
    "habanero>=2.9,<3",
    "pyalex>=0.21,<1",
]

[project.scripts]
wmk-papers = "wmk_papers.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmk_papers"]
