# Gate G1: kernel tests, shape tests and manifest validation (docs/milestone-1.md, T0).
name: ci

on:
  push:
  pull_request:

jobs:
  kernel:
    name: kernel tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 16 is the kernel's floor (spec §2); 17 is what deploy/postgres/Dockerfile builds on.
        postgres: ["16.15-bookworm", "17.11-bookworm"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kernel invariant tests
        run: |
          sh kernel/schema/tests/run.sh 2>&1 | tee kernel-tests.log
          test "$(grep -c 'NOTICE:  ok:' kernel-tests.log)" -ge 30
          grep -q 'ALL KERNEL TESTS PASSED' kernel-tests.log

  python-checks:
    name: shapes and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-ci.txt
      - name: SHACL shape tests
        run: python shapes/tests/test_shapes.py
      - name: Manifests, chains and slots
        run: python scripts/check_manifests.py
      - name: Validator eval (T4)
        run: python modules/validator-shacl/tests/test_eval.py
      - name: Self-encoder tests (T6)
        run: python modules/self-encoder/tests/test_encode.py
      - name: Belief eval (T7)
        run: python modules/belief-corroboration/tests/test_eval.py
      - name: Generated pack migration is up to date
        run: |
          PYTHONPATH=modules/pack-loader python -m pack_loader > /tmp/packs.sql
          diff -q /tmp/packs.sql modules/pack-loader/packs.sql

  kernel-smoke:
    name: kernel alone (G4)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-ci.txt -r modules/kernel-mcp/requirements.txt -r modules/validator-shacl/requirements.txt -r modules/belief-corroboration/requirements.txt -r modules/self-encoder/requirements.txt
      - name: gitleaks for the ingest filter (pinned release, checksum verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Postgres + validator + belief + kernel-mcp over stdio + ingestion, nothing else
        run: sh scripts/smoke_kernel.sh
      - name: kernel-mcp installs as a package with its two commands
        run: |
          pip install ./modules/kernel-mcp
          command -v kernel-mcp
          kernel-mcp-hook < /dev/null || test $? = 2
      - name: Compose file is valid
        run: |
          sed 's/=$/=placeholder/' deploy/.env.example > /tmp/ci.env
          docker compose -f deploy/compose.yaml --env-file /tmp/ci.env config -q
