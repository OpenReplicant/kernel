# Gate G1: kernel tests, shape tests and manifest validation (docs/milestone-1.md, T0).
name: ci

on:
  push:
  pull_request:

jobs:
  kernel:
    name: kernel tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 16 is the kernel's floor (spec §2); 17 is what deploy/postgres/Dockerfile builds on.
        postgres: ["16.15-bookworm", "17.11-bookworm"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kernel invariant tests
        run: |
          sh kernel/schema/tests/run.sh 2>&1 | tee kernel-tests.log
          test "$(grep -c 'NOTICE:  ok:' kernel-tests.log)" -ge 30
          grep -q 'ALL KERNEL TESTS PASSED' kernel-tests.log

  python-checks:
    name: shapes and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-ci.txt
      - name: SHACL shape tests
        run: python shapes/tests/test_shapes.py
      - name: Manifests and slots
        run: python scripts/check_manifests.py
      - name: Validator eval (T4)
        run: python modules/validator-shacl/tests/test_eval.py
      - name: Self-encoder tests (T6)
        run: python modules/self-encoder/tests/test_encode.py
      - name: Event-log encoder tests (M2-T1)
        run: python modules/encoder-eventlog/tests/test_encode.py
      - name: BPMN encoder tests (M2-T2)
        run: python modules/encoder-bpmn/tests/test_encode.py
      - name: Conformance tests (M2-T3)
        run: python modules/conformance/tests/test_compare.py
      - name: Paper encoder and SciFact scorer tests (D-59)
        run: |
          python modules/encoder-papers/tests/test_encode.py
          python eval/scifact/test_score.py
      - name: Sandbox policy tests (D-55)
        run: python kk/tests/test_modules.py
      - name: Metrics observer tests (M2-T5)
        run: python modules/observer-prometheus/tests/test_observe.py
      - name: Anomaly and actuator tests (M2-T6)
        run: |
          python modules/anomaly/tests/test_detect.py
          python modules/actuator-compose/tests/test_plan.py
      - name: Belief eval (T7)
        run: python modules/belief-corroboration/tests/test_eval.py
      - name: Generated pack migration is up to date
        run: |
          PYTHONPATH=modules/pack-loader python -m pack_loader > /tmp/packs.sql
          diff -q /tmp/packs.sql modules/pack-loader/packs.sql

  kernel-smoke:
    name: kernel alone (G3, G4, T13, T17, T18, T20)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Postgres 17 with pgvector, as deploy/postgres/Dockerfile builds (dense recall, D-61).
        image: pgvector/pgvector:0.8.7-pg17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install the kernel (kk) with the pinned requirements
        run: |
          pip install -r requirements-ci.txt -r modules/kernel-mcp/requirements.txt -r modules/validator-shacl/requirements.txt -r modules/belief-corroboration/requirements.txt -r modules/self-encoder/requirements.txt -r modules/recall-dense/requirements.txt
          pip install --no-deps -e .
          kk --help > /dev/null
      - name: gitleaks for the ingest filter (pinned release, checksum verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Playwright and Chromium for the UI check (pinned)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Postgres + kk (init, person, agent, serve, review, scan, token, status) + the UI, nothing else
        run: KK_REQUIRE_UI=1 KK_REQUIRE_DENSE=1 sh scripts/smoke_kernel.sh
      - name: kernel-mcp alone installs as a package with its two commands
        run: |
          python -m venv /tmp/mcp-only
          /tmp/mcp-only/bin/pip install ./modules/kernel-mcp
          test -x /tmp/mcp-only/bin/kernel-mcp
          /tmp/mcp-only/bin/kernel-mcp-hook < /dev/null || test $? = 2
      - name: The kk image builds and runs
        run: |
          docker build -t knowledge-kernel:local .
          docker run --rm knowledge-kernel:local kk --help > /dev/null
          docker run --rm knowledge-kernel:local gitleaks version
      - name: A module installs into its own sandboxed container (T18)
        run: sh scripts/e2e_module.sh
      - name: Devops demo, the MAPE-K loop and the Devops view, sandboxed (M2-T5–T7, M2-G2)
        run: KK_REQUIRE_UI=1 sh scripts/e2e_devops.sh
      - name: Compose file is valid
        run: |
          sed 's/=$/=placeholder/' deploy/.env.example > /tmp/ci.env
          docker compose -f deploy/compose.yaml --env-file /tmp/ci.env config -q
          docker compose -f deploy/compose.yaml -f deploy/demo/compose.yaml --env-file /tmp/ci.env config -q
