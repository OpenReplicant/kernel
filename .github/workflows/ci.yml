# Gate G1: kernel tests, shape tests and manifest validation (docs/milestone-1.md, T0).
name: ci

on:
  push:
  pull_request:

jobs:
  kernel:
    name: kernel tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 16 is the kernel's floor (spec §2); 17 is what deploy/postgres/Dockerfile builds on.
        postgres: ["16.15-bookworm", "17.11-bookworm"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kernel invariant tests
        run: |
          sh kernel/schema/tests/run.sh 2>&1 | tee kernel-tests.log
          test "$(grep -c 'NOTICE:  ok:' kernel-tests.log)" -ge 30
          grep -q 'ALL KERNEL TESTS PASSED' kernel-tests.log

  python-checks:
    name: shapes and manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-ci.txt
      - name: SHACL shape tests
        run: python shapes/tests/test_shapes.py
      - name: Manifests, chains and slots
        run: python scripts/check_manifests.py
      - name: Validator eval (T4)
        run: python modules/validator-shacl/tests/test_eval.py
      - name: Chain runner tests (T5)
        run: python modules/chain-runner-python/tests/test_engine.py
      - name: Self-encoder tests (T6)
        run: python modules/self-encoder/tests/test_encode.py
      - name: Belief eval (T7)
        run: python modules/belief-corroboration/tests/test_eval.py
      - name: Graph decoder tests (T9)
        run: python modules/graph-decoder/tests/test_graph.py
      - name: Chain decoder tests (T10)
        run: python modules/chain-decoder-rulego/tests/test_compile.py
      - name: Generated pack migration is up to date
        run: |
          PYTHONPATH=modules/pack-loader python -m pack_loader > /tmp/packs.sql
          diff -q /tmp/packs.sql modules/pack-loader/packs.sql

  stack-smoke:
    name: stack smoke test (T2-T10)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-ci.txt
      - name: Playwright for the UI check (G3)
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Stack up, API auth, packs and slots
        run: sh scripts/smoke_stack.sh

  rulego:
    name: kk-rulego (RuleGo-Server build and components)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: modules/chain-runner-rulego
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.25.14"
          cache-dependency-path: modules/chain-runner-rulego/go.sum
      - name: gofmt and vet
        run: test -z "$(gofmt -l .)" && go vet ./...
      - name: Component tests (against Postgres)
        env:
          KK_TEST_PG_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -v ./...
      - name: Image builds
        run: docker build -t kk-rulego . && docker run --rm --entrypoint kk-rulego kk-rulego -v
