name: ci

on:
  # Pull requests run CI once; main runs it again after each merge.
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make lint

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Start the stack (db + gateway)
        run: make up
      - name: Unit, SQL and regression tests
        run: make test
      - name: Eval fixtures and the resolution set through the eval profile
        run: make eval
      - name: Seed the running stack through its gateway
        run: make seed
      - name: Map this repository into the stack with the software pack's adapter
        run: make map-self
      - name: Observe the running stack and check it for drift against what was mapped
        run: make observe-self
      - name: Replay the live log (a non-empty diff fails the build)
        run: make replay
      - name: Start the read-only explorer (Caddy and PostgREST)
        run: make up-ui
      - name: Explorer smoke (refused writes, every page in headless Chromium)
        run: |
          make ui-browser
          make ui-smoke
      - name: Stack logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            evals/out/report.json
            evals/out/resolution.json
          if-no-files-found: ignore
