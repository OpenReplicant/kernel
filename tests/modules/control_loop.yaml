# Role types for a feedback control loop: a non-agent domain for the systems module's tests
# and the component-graph compiler's second case (tests/modules/test_compile.py).
vocabulary: control-loop
version: "2"
imports: [systems]
prefix: { cl: "urn:test:control-loop:" }
port_types:
  celsius: { type: number }
  watts:   { type: number }
roles:
  - { iri: cl:Sensor,     key: sensor,     ports: [sample:in, reading:out:celsius] }
  - { iri: cl:Controller, key: controller, ports: [input:in:celsius, command:out:watts, done:out] }
  - { iri: cl:Actuator,   key: actuator,   ports: [power:in:watts, applied:out:celsius] }
