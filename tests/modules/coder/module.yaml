# Test module (S4): a model writes a function for a small task, the sandbox runs the task's
# tests on it, and whether they passed is observed. The code is untrusted: it only ever runs in
# the sandbox.
module: coder
version: "0.1.0"
types: [ontology, effector, perceiver]
depends: [models]
ontology:
  things:
    - {label: task}
  relations:
    - {name: coder.passed, as: claim}     # true/false: the task's tests on the model's code, observed in the sandbox
models:
  writer:
    model: claude-code-haiku
    budget: {tokens: 100000}
chains:
  - chains/solve.json
