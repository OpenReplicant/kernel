# Rootless Podman: `podman compose up -d` (or `podman-compose up -d`).
# Postgres applies db/*.sql in name order on first start (empty volume only).
# RuleGo is added here only if M0 decides it runs in a container (docs/RULEGO_NOTES.md).
services:
  postgres:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: kernel
      POSTGRES_PASSWORD: kernel
      POSTGRES_DB: kernel
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro,Z
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kernel"]
      interval: 2s
      retries: 30

  # Build-only: the image payloads run in (docs/V1_BUILD_PLAN.md, M5).
  # `podman compose build sandbox`
  sandbox:
    build: ./sandbox
    image: localhost/kernel-sandbox:latest
    profiles: ["build"]

volumes:
  pgdata:
